# Cherry OS lock screen for Hyprland. Copy to ~/.config/hypr/ to change it.
$font = Noto Sans

general {
    hide_cursor = false
}

background {
    monitor =
    path = /usr/share/backgrounds/cherry/cherry-night.png
    blur_passes = 2
}

label {
    monitor =
    text = $TIME
    font_size = 96
    font_family = $font
    color = rgba(251, 233, 239, 1.0)
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A %-d %B"
    font_size = 24
    font_family = $font
    color = rgba(251, 233, 239, 0.9)
    position = 0, 70
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 3
    inner_color = rgba(42, 18, 32, 0.85)
    outer_color = rgba(200, 16, 64, 1.0)
    check_color = rgba(255, 138, 165, 1.0)
    fail_color = rgba(255, 110, 110, 1.0)
    font_color = rgba(251, 233, 239, 1.0)
    font_family = $font
    fade_on_empty = false
    rounding = 28
    placeholder_text = Password
    fail_text = $PAMFAIL
    position = 0, -40
    halign = center
    valign = center
}
