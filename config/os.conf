# Cherry OS — build configuration (sourced by build.sh and scripts/)

OS_NAME="Cherry OS"
OS_ID="cherry"
OS_VERSION="1.0"
OS_CODENAME="blossom"
OS_HOSTNAME="cherry"
LIVE_USERNAME="cherry"

LOCALE="en_AU.UTF-8"
TIMEZONE="Australia/Sydney"
KEYBOARD_LAYOUT="us"

DEBIAN_SUITE="trixie"
DEBIAN_MIRROR="http://deb.debian.org/debian"
ARCH="amd64"

# Every desktop in DESKTOPS is installed; users preview them live and switch in Cherry Settings.
# Ids match config/packages/desktop-<id>.list and desktop/lib/cherryos/desktops.py.
DESKTOPS="kde gnome cinnamon xfce budgie"
DEFAULT_DESKTOP="kde"

# Cherry Cloud: the package store (cloud/). Override per machine in
# /etc/cherry/cloud.conf or with CHERRY_CLOUD_URL.
CLOUD_URL="https://cherry-cloud.isaiahcannings.workers.dev"
